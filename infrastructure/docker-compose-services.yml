        condition: service_healthy
      consul:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - superpowers
  notification-outbox-publisher:
    image: ${kudi_repos:-zhcoder-docker-registry.com:8000/micro-server}/notification-service:${IMAGE_TAG:-1.7.0-pg}
    command:
      - ntf_outbox_publisher
    restart: unless-stopped
    labels:
