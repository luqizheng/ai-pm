  audit-service:
    image: ${kudi_repos:-zhcoder-docker-registry.com:8000/micro-server}/audit-service:${IMAGE_TAG:-1.7.0-pg}
    ports:
      - 8084:8084
    labels:
      - SERVICE_NAME=audit-service
      - SERVICE_ID=audit-service
      - SERVICE_PORT=8084
      - SERVICE_TAGS=backend,audit-service
      - SERVICE_8084_CHECK_HTTP=/health
      - SERVICE_8084_CHECK_INTERVAL=30s
      - SERVICE_8084_CHECK_TIMEOUT=3s
      - logging=loki
      - service=audit-service
      - env=staging
    environment:
      JWKS_URL: ${JWKS_URL}
      DATABASE_URL: ${DATABASE_URL}
      EVENT_BUS_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@${RABBITMQ_HOST}:${RABBITMQ_PORT}/%2f
      REDIS_URL: redis://${REDIS_HOST}:${REDIS_PORT}
      RUST_LOG: info
      SERVICE_NAME: audit-service
      SERVER_PORT: '8084'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - superpowers

  # ─────────── ai-pm 自有服务（本仓；原 docker-compose-aipm.yml，已并入本文件） ───────────
  # 镜像来源：
  #   ai-pm 仓（本仓）：    docker build --target runtime-pm-api ... -t aipm/pm-api:0.1.0 . 等
  #   ai-pm-web 仓：        docker build --target runtime-bff -t aipm/aipm-bff:0.1.0 .
  #                         docker build --target runtime-web -t aipm/aipm-web:0.1.0 .
  # 全部挂 superpowers 网络（与 lmms 栈同网络，服务名互访）。

  aipm-pg:
    image: postgres:16
    environment:
      POSTGRES_USER: aipm
      POSTGRES_PASSWORD: aipm
      POSTGRES_DB: aipm
    volumes:
      - aipm_pg_data:/var/lib/postgresql/data
    ports:
      # 宿主机工具连库：5433 = aipm-pg-dev（独立旧容器），5434 = coder-test-pg（共享测试容器），错开到 5435
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aipm -d aipm"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - superpowers

  pm-api:
    image: ${AIPM_REGISTRY:-aipm}/pm-api:${AIPM_VERSION:-0.1.0}
    environment:
      DATABASE_URL: postgres://aipm:aipm@aipm-pg:5432/aipm
      PM_API_PORT: "8090"
      # 鉴权（slice B）：默认 jwks fail-closed，JWKS 取自同网络（superpowers）的 lmms token-service
      AI_PM_AUTH_MODE: "jwks"
      AI_PM_JWKS_URL: http://token-service:8082/.well-known/jwks.json
      # 首管理员对：命中 (tenant, subject) 的登录主体首次接入时被开为 active
      # （其余新身份默认 inactive）。留空则不启用首管理员通道。
      AI_PM_FIRST_ADMIN_TENANT: "${AI_PM_FIRST_ADMIN_TENANT:-}"
      AI_PM_FIRST_ADMIN_SUBJECT: "${AI_PM_FIRST_ADMIN_SUBJECT:-}"
      # T-081：/mcp 跨机暴露的 Host 白名单（rmcp DNS-rebinding 防护默认只放回环）。
      # 部署方声明部署地址；只增不减，回环默认值恒在。留空 = 仅回环可访问。
      AI_PM_MCP_ALLOWED_HOSTS: "${AI_PM_MCP_ALLOWED_HOSTS:-}"
    ports:
      - "8090:8090"
    depends_on:
      aipm-pg:
        condition: service_healthy
      token-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - superpowers

  pm-worker:
    image: ${AIPM_REGISTRY:-aipm}/pm-worker:${AIPM_VERSION:-0.1.0}
    environment:
      DATABASE_URL: postgres://aipm:aipm@aipm-pg:5432/aipm
    depends_on:
      aipm-pg:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - superpowers

  ai-pm-worker:
    image: ${AIPM_REGISTRY:-aipm}/ai-pm-worker:${AIPM_VERSION:-0.1.0}
    environment:
      DATABASE_URL: postgres://aipm:aipm@aipm-pg:5432/aipm
      AI_PM_POLICY_FILE: /app/policies/ai-pm-ai-lead-v2.yaml
    depends_on:
      aipm-pg:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - superpowers

  # ai-pm-web 前端仓：Rust BFF（与 ai-pm 共享 aipm 库，只做门面不做迁移）
  aipm-bff:
    image: ${AIPM_REGISTRY:-aipm}/aipm-bff:${AIPM_VERSION:-0.1.0}
    environment:
      DATABASE_URL: postgres://aipm:aipm@aipm-pg:5432/aipm
      IAM_MODE: local
    ports:
      - "8080:8080"
    depends_on:
      aipm-pg:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - superpowers

  # ai-pm-web 前端静态站（nginx 伺服 dist，/api 反代 aipm-bff）
  aipm-web:
    image: ${AIPM_REGISTRY:-aipm}/aipm-web:${AIPM_VERSION:-0.1.0}
    ports:
      - "8091:80"
    depends_on:
      - aipm-bff
    restart: unless-stopped
    networks:
      - superpowers

volumes:
  file-storage: null
  aipm_pg_data: null
networks:
  superpowers: null
