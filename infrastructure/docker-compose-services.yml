      RUST_LOG: info
      SERVICE_NAME: prue_backend
      SERVER_PORT: '8087'
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - superpowers
  notification-service:
    image: ${kudi_repos:-zhcoder-docker-registry.com:8000/micro-server}/notification-service:${IMAGE_TAG:-1.7.0-pg}
    ports:
      - 8083:8083
    labels:
      - SERVICE_NAME=notification-service
      - SERVICE_ID=notification-service
      - SERVICE_PORT=8083
      - SERVICE_TAGS=backend,notification-service
      - SERVICE_8083_CHECK_HTTP=/health
      - SERVICE_8083_CHECK_INTERVAL=30s
      - SERVICE_8083_CHECK_TIMEOUT=3s
      - logging=loki
