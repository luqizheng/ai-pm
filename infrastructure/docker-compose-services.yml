    environment:
      DATABASE_URL: ${DATABASE_URL}
      EVENT_BUS_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@${RABBITMQ_HOST}:${RABBITMQ_PORT}/%2f
      EVENT_BUS_EXCHANGE: events
      OUTBOX_POLL_INTERVAL_MS: '1000'
      OUTBOX_BATCH_SIZE: '100'
      METRICS_FILE_PATH: /var/run/prometheus/ntf_outbox.prom
    healthcheck:
      test:
        - CMD-SHELL
        - f="$${METRICS_FILE_PATH:-/var/run/prometheus/ntf_outbox.prom}"; [ -f "$$f" ] && [ $$(( $$(date +%s) - $$(stat -c %Y "$$f") )) -le 60 ]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
