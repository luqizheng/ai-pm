# infrastructure/docker-compose.prod.yml
# ─────────────────────────────────────────────────────────────────────────────
# Production overlay — 在 docker-compose.yml 之上叠加 dev → prod 的两个差异轴。
# 设计依据：docs/superpowers/specs/2026-07-06-prod-compose-overlay-design.md
#
# ⚠️  需要 docker compose v2.20+（!override 标签依赖）。由 start-prod.sh
#    在启动时 self-check 版本，版本不达标 fail-fast。
#
# ⚠️  本文件不包含 secrets 覆写：所有敏感变量从 `.env.prod` 加载。
#     start-prod.sh 在加载完 env 后会显式校验关键变量非空且非默认值。
#
# 用法：
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml config   # 校验
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d   # 起 prod
#   或直接：./start-prod.sh
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ─────────────────────────────────────────────────────────────────────────
  #  内部组件（postgres / mysql / redis / rabbitmq / consul）：
  #  ⚠️ 2026-11-06 起 infra 组已迁至 192.168.2.10，docker-compose.yml 不再 include
  #  infra/docker-compose-infra.yml，本 overlay 因此不再覆写这些服务
  #  （覆写不存在的基础服务会让 compose 报 service 无 image/build 错误）。
  #  本机部署只覆盖 services 组与 ai-pm 自有服务。
  # ─────────────────────────────────────────────────────────────────────────

  # ─────────────────────────────────────────────────────────────────────────
  #  lmms 业务服务（登录验证栈 + 其余业务服务）：
  #    - 除 api-gateway 外清空 host port（api-gateway 是登录验证入口，
  #      外部浏览器走 /gw → api-gateway:3000）
  #    - 加 restart: unless-stopped（容器内部端口仍可互通）
  # ─────────────────────────────────────────────────────────────────────────
  api-gateway:
    restart: unless-stopped
  token-service:
    ports: !override []
    restart: unless-stopped
  iam-service:
    ports: !override []
    restart: unless-stopped
  audit-service:
    ports: !override []
    restart: unless-stopped
  notification-service:
    ports: !override []
    restart: unless-stopped
  file-service:
    ports: !override []
    restart: unless-stopped
  prue_backend:
    ports: !override []
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  #  outbox publishers（iam-outbox-publisher / notification-outbox-publisher）：
  #  已在 base 文件中有 restart: unless-stopped 且无 ports，本 overlay 不动。
  # ─────────────────────────────────────────────────────────────────────────

  # ─────────────────────────────────────────────────────────────────────────
  #  ai-pm 自有服务：
  #    - pm-api / aipm-bff 清空 host port（外部走 aipm-web:8091 的 /api 反代）
  #    - pm-worker / ai-pm-worker：无 host port，仅加 restart
  #    - aipm-pg：保留 5435 宿主映射（ops 连库用），加 restart
  #    - aipm-web：保留 8091（前端公共入口），加 restart
  # ─────────────────────────────────────────────────────────────────────────
  pm-api:
    ports: !override []
    restart: unless-stopped
  aipm-bff:
    ports: !override []
    restart: unless-stopped
  pm-worker:
    restart: unless-stopped
  ai-pm-worker:
    restart: unless-stopped
  aipm-pg:
    restart: unless-stopped
  aipm-web:
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  #  observability（prometheus / grafana / jaeger / otel-collector / alertmanager
  #  / consul-template）：host port 保留（ops 直连），restart 已在 base 文件里有，
  #  本 overlay 不动。
  # ─────────────────────────────────────────────────────────────────────────
