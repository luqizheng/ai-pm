services:
  # Consul 单节点 server 模式（2026-11-06 与 lmms 对齐：registrator 退役，
  # 服务进程自注册——vendor/digua-common-consul）。持久卷随 raft 落盘，
  # Consul 重启不丢注册；服务实例由 health check + deregister_critical_service_after 兜底。
  consul:
    image: ${consul:-hashicorp/consul:2.0.1}
    hostname: consul
    ports:
      - 8500:8500
      - 8502:8502
    volumes:
      - ./config/consul/connect.hcl:/consul/config/connect.hcl:ro
      - consul_data:/consul/data
    command: agent -server -bootstrap-expect=1 -node=consul-server -bind=0.0.0.0 -client=0.0.0.0
    healthcheck:
      test:
        - CMD-SHELL
        - consul members && nc -z 127.0.0.1 8502
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - superpowers
  redis:
    image: ${redis:-redis:7-alpine}
    hostname: ${REDIS_HOST}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_DATABASES: ${REDIS_DATABASES}
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - superpowers
  mysql:
    image: ${mysql:-mysql:8.0}
    hostname: ${MYSQL_HOST}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_HOST_AUTH_METHOD: ${MYSQL_HOST_AUTH_METHOD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
        - -uroot
        - -p${MYSQL_ROOT_PASSWORD}
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - superpowers
    profiles:
      - mysql
  rabbitmq:
    image: ${rabbitmq:-rabbitmq:3.13-management-alpine}
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./config/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./config/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - superpowers
  postgres:
    image: ${BASE_REGISTRY}postgres:16
    hostname: ${POSTGRES_HOST:-postgres}
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-coder}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
    ports:
      - ${POSTGRES_PORT:-5434}:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-coder}
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - superpowers
volumes:
  consul_data:
    name: infrastructure_consul_data
  redis_data:
    name: infrastructure_redis_data
  mysql_data:
    name: infrastructure_mysql_data
  rabbitmq_data:
    name: infrastructure_rabbitmq_data
  postgres_data:
    name: infrastructure_postgres_data
# 与 lmms 同名共享网络语义保留：external 预建（宿主上由 start-prod.sh 幂等创建）。
networks:
  superpowers:
    external: true
