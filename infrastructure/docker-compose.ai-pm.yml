# ── ai-pm 自有服务（本仓所有；升级模板包时本文件不被覆盖） ──────────────────
# 2026-11-06 从 docker-compose-services.yml 拆出独立文件（此前 2026-11-05 曾由
# docker-compose-aipm.yml 并入 services.yml），恢复「升级 lmms 层 = 整目录覆盖
# lmms 命名文件、ai-pm 命名文件天然存活」能力，见 README「与上游模板包的有意差异」#2。
# 镜像来源：
#   ai-pm 仓（本仓）：    docker build --target runtime-pm-api ... -t aipm/pm-api:0.1.0 . 等
#   ai-pm-web 仓：        docker build --target runtime-bff -t aipm/aipm-bff:0.1.0 .
#                         docker build --target runtime-web -t aipm/aipm-web:0.1.0 .
# 全部挂 superpowers 网络（与 lmms 栈同网络，服务名互访）。
#
# ⚠️ YAML anchor 不能跨 include 文件：下面两个 anchor 与 docker-compose-services.yml
#    的同名 anchor 各自独立（本文件 pm-api 消费）；改一处记得同步另一处。
# 注册契约：vendor/digua-common-consul 读 CONSUL_ADDR/SERVICE_NAME/SERVICE_PORT/
#           SERVICE_HEALTH_PATH；SERVICE_ADDRESS 空值回退容器 hostname
#           （合体单机部署留默认即可，跨主机部署设为本机 LAN IP）。
x-consul-env: &consul-env
  CONSUL_ADDR: "${CONSUL_ADDR:-http://consul:8500}"
  SERVICE_ADDRESS: "${SERVICE_ADDRESS:-}"
  SERVICE_HEALTH_PATH: "/health"

x-loki-labels: &loki-labels
  logging: "loki"
  env: "staging"


services:
  aipm-pg:
    image: postgres:16
    environment:
      POSTGRES_USER: aipm
      POSTGRES_PASSWORD: aipm
      POSTGRES_DB: aipm
    volumes:
      - aipm_pg_data:/var/lib/postgresql/data
    ports:
      # 宿主机工具连库：5433 = aipm-pg-dev（独立旧容器），5434 = coder-test-pg（共享测试容器）。
      # 16433 = 2026-11-06 从 5435 迁入——重启后 5435 落入 Hyper-V/WinNAT 排除区段导致端口转发假活（TCP 可连、PG 不应答），换到高位段规避
      - "16433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aipm -d aipm"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - superpowers

  pm-api:
    image: ${AIPM_REGISTRY:-aipm}/pm-api:${AIPM_VERSION:-0.1.0}
    # 2026-11-05 起 pm 与 iam 一致挂网关对外（/v1/pm/* → pm-api，见 config/api-gateway/
    # routes/pm.router.toml）；consul 自注册经 *consul-env（13e7363，无 registrator）。
    labels:
      <<: *loki-labels
      service: pm-api
    environment:
      <<: *consul-env
      SERVICE_PORT: "8090"
      # 不做 consul 自注册：consul 在 192.168.2.10，健康检查需回拨本机 8090，
      # 而 prod 片已收口 pm-api 宿主端口；与 iam-service 同等口径改走
      # api-gateway 的 egress_map（静态服务名 → container DNS）。
      DATABASE_URL: postgres://aipm:aipm@aipm-pg:5432/aipm
      PM_API_PORT: "8090"
      # 鉴权（slice B）：默认 jwks fail-closed，JWKS 取自同网络（superpowers）的 lmms token-service
      AI_PM_AUTH_MODE: "jwks"
      AI_PM_JWKS_URL: http://token-service:8082/.well-known/jwks.json
      # 文件代理（2026-11-07 file-service 收口配套）：pm-api 进 lmms
      # bootstrap 白名单（SERVICE_BOOTSTRAP_TOKENS 里的 PM_DEV_BT），
      # 出站按请求租户铸 service-jwt 调 file-service。缺省（空）= 代理
      # 禁用，/v1/file/* 返回 503。
      SERVICE_BOOTSTRAP_TOKEN: "${PM_DEV_BT:-}"
      AI_PM_TOKEN_SERVICE_URL: http://token-service:8082
      FILE_SERVICE_URL: http://file-service:8082
      # SSH 部署密钥的封私钥主密钥（secret::seal_text，AAD=project_id）。
      # 值必须稳定：换值 = 库内已封私钥全部不可解（公钥仍可读，私钥永不出 REST）。
      AI_PM_SECRET_KEY: "${AI_PM_SECRET_KEY:-}"
      # 首管理员对：命中 (tenant, subject) 的登录主体首次接入时被开为 active
      # （其余新身份默认 inactive）。留空则不启用首管理员通道。
      AI_PM_FIRST_ADMIN_TENANT: "${AI_PM_FIRST_ADMIN_TENANT:-}"
      AI_PM_FIRST_ADMIN_SUBJECT: "${AI_PM_FIRST_ADMIN_SUBJECT:-}"
      # T-081：/mcp 跨机暴露的 Host 白名单（rmcp DNS-rebinding 防护默认只放回环）。
      # 部署方声明部署地址；只增不减，回环默认值恒在。留空 = 仅回环可访问。
      AI_PM_MCP_ALLOWED_HOSTS: "${AI_PM_MCP_ALLOWED_HOSTS:-}"
      # F-7 过渡开关（ACP 审计）：lmms 权限字典落地前 ACP 四新工具降级仅
      # PM_MCP_READ；默认空 = fail-closed；V-05-1 后移除。
      AI_PM_MCP_LEGACY_PERMISSION_GRANT: "${AI_PM_MCP_LEGACY_PERMISSION_GRANT:-}"
    ports:
      - "8090:8090"
    depends_on:
      aipm-pg:
        condition: service_healthy
      token-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - superpowers

  pm-worker:
    image: ${AIPM_REGISTRY:-aipm}/pm-worker:${AIPM_VERSION:-0.1.0}
    environment:
      DATABASE_URL: postgres://aipm:aipm@aipm-pg:5432/aipm
    depends_on:
      aipm-pg:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - superpowers

  ai-pm-worker:
    image: ${AIPM_REGISTRY:-aipm}/ai-pm-worker:${AIPM_VERSION:-0.1.0}
    environment:
      DATABASE_URL: postgres://aipm:aipm@aipm-pg:5432/aipm
      AI_PM_POLICY_FILE: /app/policies/ai-pm-ai-lead-v2.yaml
    depends_on:
      aipm-pg:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - superpowers

  # ai-pm-web 前端仓：Rust BFF（与 ai-pm 共享 aipm 库，只做门面不做迁移）
  aipm-bff:
    image: ${AIPM_REGISTRY:-aipm}/aipm-bff:${AIPM_VERSION:-0.1.0}
    environment:
      DATABASE_URL: postgres://aipm:aipm@aipm-pg:5432/aipm
      IAM_MODE: local
    ports:
      - "8080:8080"
    depends_on:
      aipm-pg:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - superpowers

  # ai-pm-web 前端静态站（nginx 伺服 dist，/api 反代 api-gateway）
  aipm-web:
    image: ${AIPM_REGISTRY:-aipm}/aipm-web:${AIPM_VERSION:-0.1.0}
    ports:
      - "8091:80"
    volumes:
      # /api 转发到 api-gateway:3000（覆盖镜像内默认的 → aipm-bff:8080）
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - aipm-bff
    restart: unless-stopped
    networks:
      - superpowers

volumes:
  aipm_pg_data:
    name: infrastructure_aipm_pg_data
networks:
  superpowers:
    external: true
