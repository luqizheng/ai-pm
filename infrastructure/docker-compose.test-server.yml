# infrastructure/docker-compose.test-server.yml
# ─────────────────────────────────────────────────────────────────────────────
# 测试机 overlay —— 用于 Codex Bootstrap 两机拓扑的内网测试服务器。
#
# 背景：prod overlay 按生产口径把 pm-api 的宿主端口清空（外部统一走
# aipm-web:8091 的 /api 反代）。但测试机上：
#   1) aipm-web / aipm-bff 镜像依赖 ai-pm-web 仓（当前不可构建），反向代理不存在；
#   2) Codex / Z-Code 侧的 Remote MCP 需要直连 pm-api 的 /mcp
#      （见 docs/ai-pm-codex-bootstrap-v1.md §〇 两机拓扑 / T-081 跨机暴露）。
# 因此这里把 pm-api 的 8090 重新发布到宿主，供内网测试机访问。
#
# 用法（叠加顺序：base → prod → test-server）：
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#                  -f docker-compose.test-server.yml up -d <services...>
# 或用 start-prod.sh 的等价参数形式（见 scripts/start-prod.sh）。
#
# ⚠️ 仅限内网测试机使用；生产环境不要叠加本文件。
# ─────────────────────────────────────────────────────────────────────────────

services:

  pm-api:
    # 宿主 8090 → 容器 8090：内网测试机直连 /mcp 与 /v1/pm/*
    ports:
      - "8090:8090"
    environment:
      # T-081：rmcp 的 DNS-rebinding 白名单——只接受回环 Host，跨机接入必须由
      # 部署方显式放行本机地址。写 host（不限端口）或 host:port（端口须精确匹配）。
      # 留空即退回「仅回环」，因此这里用 `:?` 强制声明，避免忘配导致跨机 403。
      AI_PM_MCP_ALLOWED_HOSTS: "${AI_PM_MCP_ALLOWED_HOSTS:?AI_PM_MCP_ALLOWED_HOSTS must be set on the cross-machine test server}"
      # 接入指引（/install/{tool}）里的平台地址与 Host 头来源——必须写测试机对外
      # 地址，否则指引会把执行端指向回环地址。
      AI_PM_PUBLIC_BASE_URL: "${AI_PM_PUBLIC_BASE_URL:?AI_PM_PUBLIC_BASE_URL must be set on the cross-machine test server}"
      # 知识库 Git 仓（Markdown 真源）挂到卷上：不设时落在容器内 /ai-pm-knowledge，
      # 容器重建即丢。首用自初始化（ensure_ready 建仓+播种模板）。
      AI_PM_KNOWLEDGE_ROOT: /data/knowledge
    volumes:
      - pm-api-knowledge:/data/knowledge

  # token-service 额外发布 JWKS 端点，便于测试机从外部核对 JWKS 与登录链路
  token-service:
    ports:
      - "8082:8082"

volumes:
  pm-api-knowledge:
