# ai-pm 编排入口 —— 基础模板来自 lmms coder-compose-template 1.7.0-pg（PostgreSQL 方言）。
# 与 lmms 同布局（目录名 infrastructure → compose 项目同名），
# 因此网络/卷与 lmms 栈同命名空间：`superpowers` 网络即 infrastructure_superpowers，
# ai-pm 服务与 lmms 服务可直接互访（服务名即 DNS）。
#
# include 了四块：
#   infra/docker-compose-infra.yml       — 基础设施（consul/redis/rabbitmq/postgres/mysql[profile]）
#   services/docker-compose-services.yml — lmms 业务服务（api-gateway/iam-service/token-service
#                                      及其余业务服务，镜像引用版）——升级模板包时可整体覆盖
#   observability/docker-compose-observability.yml — 可观测性（prometheus/grafana/jaeger/otel/alertmanager/consul-template）
#   docker-compose.ai-pm.yml         — ai-pm 自有 6 服务（本仓所有，升级不被覆盖）
# 文件所有权边界：lmms 命名文件可随上游模板升级整目录覆盖；ai-pm 命名文件与
# .env（环境值）升级时天然存活，见 infrastructure/README.md。

include:
  - infra/docker-compose-infra.yml
  - services/docker-compose-services.yml
  - observability/docker-compose-observability.yml
  - docker-compose.ai-pm.yml

services: {}

# superpowers 网络由被 include 的组文件声明（external: true，start-prod.sh 幂等预建）；
# 此处不再重复声明，避免合体合并时 external 与 driver:bridge 冲突。
