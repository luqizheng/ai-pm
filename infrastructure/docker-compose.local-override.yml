# 本地联调 overlay——经 COMPOSE_OVERLAY=docker-compose.local-override.yml 显式叠加，
# 默认不加载（对 .10 服务器与其他机器零影响：.10 上 pm 服务本就该连本地 aipm-pg）。
# ai-pm 四服务共用远程 .10 的 aipm 库（16433）——pm 真实业务数据（设备/团队/LLM 配置）所在。
# 不指向本地 aipm-pg 的 aipm 库：该库是 lmms 合体栈旧库（lmms schema + lmms 服务各自的
# _sqlx_migrations 条目），与 pm-api 的 sqlx 迁移表同名互踩（VersionMissing(40) 根因）。
# 远程库迁移已由远程 pm-api（同版本 0.1.0）应用到 0047，本地实例启动仅做校验零操作。
services:
  pm-api:
    environment:
      DATABASE_URL: postgres://aipm:aipm@192.168.2.10:16433/aipm
  pm-worker:
    environment:
      DATABASE_URL: postgres://aipm:aipm@192.168.2.10:16433/aipm
  ai-pm-worker:
    environment:
      DATABASE_URL: postgres://aipm:aipm@192.168.2.10:16433/aipm
