# Checkpoint-1 全新栈 overlay——显式叠加（-f docker-compose.ckpt-override.yml），
# 默认不加载；摘除即恢复原栈指向（lmms→aipm-pg:aipm 旧库、pm→192.168.2.10:16433）。
#
# 目的：checkpoint-1 需要「全新部署」语义——首用户注册（iam setup_required=true）
# 与首团认领（租户内无 ACTIVE 成员）。共用旧库做不到（旧库已有用户/租户数据）。
#
# 结构：专用 PG（aipm-ckpt-pg，宿主 16453）两个库：
#   * lmms_ckpt —— lmms 全家（经 shell 级 DATABASE_URL 变量切换，见下方用法）；
#   * pm_ckpt   —— pm-api/pm-worker/ai-pm-worker（POSTGRES_DB 直建）。
# 用法（在 infrastructure/ 下）：
#   export DATABASE_URL='postgres://aipm:aipm@aipm-ckpt-pg:5432/lmms_ckpt'
#   export AI_PM_SECRET_KEY='<与 pm-api 同值；workers 解密 deploy key 必需>'
#   export AI_PM_FIRST_ADMIN_TENANT=1
#   export AI_PM_FIRST_ADMIN_SUBJECT='<iam 首用户注册返回的 id>'
#   docker compose -f docker-compose.yml -f docker-compose.ckpt-override.yml up -d
# 迁移：pm-api 启动自动跑 migrations（空库 0001→0053 全量）；lmms 服务各自启动跑。
services:
  aipm-ckpt-pg:
    image: postgres:16
    environment:
      POSTGRES_USER: aipm
      POSTGRES_PASSWORD: aipm
      POSTGRES_DB: pm_ckpt
    volumes:
      - aipm_ckpt_pg_data:/var/lib/postgresql/data
      - ./ckpt-init.sql:/docker-entrypoint-initdb.d/10-create-lmms-ckpt.sql:ro
    ports:
      # 16433=aipm-pg、16447=aipm-kbpc-pg、16499=aipm-teamqa-pg 已占，checkpoint 取 16453。
      - "16453:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aipm -d pm_ckpt"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - superpowers

  pm-api:
    environment:
      DATABASE_URL: postgres://aipm:aipm@aipm-ckpt-pg:5432/pm_ckpt

  pm-worker:
    environment:
      DATABASE_URL: postgres://aipm:aipm@aipm-ckpt-pg:5432/pm_ckpt
      # deploy key 私钥解密主密钥（与 pm-api 同值）；KB 仓库快照分析在 worker 侧执行。
      AI_PM_SECRET_KEY: "${AI_PM_SECRET_KEY:-}"
      # bare clone 缓存根（命名卷持久；容器内路径固定）。
      AI_PM_REPO_CACHE_ROOT: /repo-cache
    volumes:
      - ckpt_repo_cache:/repo-cache

  ai-pm-worker:
    environment:
      DATABASE_URL: postgres://aipm:aipm@aipm-ckpt-pg:5432/pm_ckpt
      AI_PM_SECRET_KEY: "${AI_PM_SECRET_KEY:-}"
      AI_PM_REPO_CACHE_ROOT: /repo-cache
    volumes:
      - ckpt_repo_cache:/repo-cache

volumes:
  aipm_ckpt_pg_data:
    name: infrastructure_aipm_ckpt_pg_data
  ckpt_repo_cache:
    name: infrastructure_ckpt_repo_cache
