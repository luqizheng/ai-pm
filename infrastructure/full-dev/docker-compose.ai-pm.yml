# ── ai-pm 自有服务（本仓所有；升级模板包时本文件不被覆盖） ──────────────────
# 2026-11-06 从 docker-compose-services.yml 拆出独立文件（此前 2026-11-05 曾由
# docker-compose-aipm.yml 并入 services.yml），恢复「升级 lmms 层 = 整目录覆盖
# lmms 命名文件、ai-pm 命名文件天然存活」能力，见 README「与上游模板包的有意差异」#2。
# 镜像来源：
#   ai-pm 仓（本仓）：    docker build --target runtime-pm-api ... -t aipm/pm-api:0.1.0 . 等
#   ai-frontend-web：     docker build --target runtime-web -t aipm/ai-frontend-web:0.1.0 .
#                         （源=本仓 ai-frontend/，经根 Dockerfile runtime-web 目标；
#                          2026-11-07 起 8092 为唯一前端公共入口，旧 ai-pm-web 仓的
#                          aipm-web/aipm-bff 已退役删除）
# 全部挂 superpowers 网络（与 lmms 栈同网络，服务名互访）。
#
# ⚠️ YAML anchor 不能跨 include 文件：下面两个 anchor 与 docker-compose-services.yml
#    的同名 anchor 各自独立（本文件 pm-api 消费）；改一处记得同步另一处。
# 注册契约：digua_common_consul（kellnr）读 CONSUL_ADDR/SERVICE_NAME/SERVICE_PORT/
#           SERVICE_HEALTH_PATH；SERVICE_ADDRESS 空值回退容器 hostname
#           （合体单机部署留默认即可，跨主机部署设为本机 LAN IP）。
x-consul-env: &consul-env
  CONSUL_ADDR: "${CONSUL_ADDR:-http://consul:8500}"
  SERVICE_ADDRESS: "${SERVICE_ADDRESS:-}"
  SERVICE_HEALTH_PATH: "/health"

x-loki-labels: &loki-labels
  logging: "loki"
  env: "staging"


services:
  pm-api:
    image: ${AIPM_REGISTRY:-aipm}/pm-api:${AIPM_VERSION:-0.1.0}
    # 2026-11-05 起 pm 与 iam 一致挂网关对外（/v1/pm/* → pm-api，见 config/api-gateway/
    # routes/pm.router.toml）；consul 自注册经 *consul-env（13e7363，无 registrator）。
    labels:
      <<: *loki-labels
      service: pm-api
    environment:
      <<: *consul-env
      SERVICE_PORT: "8090"
      # 不做 consul 自注册：consul 在 192.168.2.10，健康检查需回拨本机 8090，
      # 而 prod 片已收口 pm-api 宿主端口；与 iam-service 同等口径改走
      # api-gateway 的 egress_map（静态服务名 → container DNS）。
      DATABASE_URL: "${DATABASE_URL}"
      PM_API_PORT: "8090"
      # DK-F：对话载体判定开关（D-DK-3，缺省 off）。on 时才允许
      # LLM 隐式把「需求句」升级为访谈会话（可见 + 可撤销）；off 时只有
      # 显式 mode=interview 才升级。透传后可由 .env.prod 开关而无需重建镜像。
      AI_PM_CONVERSATION_ROUTER: ${AI_PM_CONVERSATION_ROUTER:-off}
      # 鉴权（slice B）：默认 jwks fail-closed，JWKS 取自同网络（superpowers）的 lmms token-service
      AI_PM_AUTH_MODE: "jwks"
      AI_PM_JWKS_URL: http://token-service:8082/.well-known/jwks.json
      # 文件代理（2026-11-07 file-service 收口配套）：pm-api 进 lmms
      # bootstrap 白名单（SERVICE_BOOTSTRAP_TOKENS 里的 PM_DEV_BT），
      # 出站按请求租户铸 service-jwt 调 file-service。缺省（空）= 代理
      # 禁用，/v1/file/* 返回 503。
      SERVICE_BOOTSTRAP_TOKEN: "${PM_DEV_BT:-}"
      AI_PM_TOKEN_SERVICE_URL: http://token-service:8082
      FILE_SERVICE_URL: http://file-service:8082
      # SSH 部署密钥的封私钥主密钥（secret::seal_text，AAD=project_id）。
      # 值必须稳定：换值 = 库内已封私钥全部不可解（公钥仍可读，私钥永不出 REST）。
      AI_PM_SECRET_KEY: "${AI_PM_SECRET_KEY:-}"
      # 首管理员对：命中 (tenant, subject) 的登录主体首次接入时被开为 active
      # （其余新身份默认 inactive）。留空则不启用首管理员通道。
      AI_PM_FIRST_ADMIN_TENANT: "${AI_PM_FIRST_ADMIN_TENANT:-}"
      AI_PM_FIRST_ADMIN_SUBJECT: "${AI_PM_FIRST_ADMIN_SUBJECT:-}"
      # 首管理员初始化探测（空库强制注册）：启动后查网关 setup-status，
      # 已有用户落记号文件下次启动跳过；空系统置 Pending（前端据此强制注册页）。
      AI_PM_SETUP_STATUS_URL: http://api-gateway:3000/v1/iam/auth/setup-status
      AI_PM_SETUP_MARKER_PATH: /app/data/setup-admin.marker
      # T-081：/mcp 跨机暴露的 Host 白名单（rmcp DNS-rebinding 防护默认只放回环）。
      # 部署方声明部署地址；只增不减，回环默认值恒在。留空 = 仅回环可访问。
      AI_PM_MCP_ALLOWED_HOSTS: "${AI_PM_MCP_ALLOWED_HOSTS:-}"
      # F-7 过渡开关（ACP 审计）：lmms 权限字典落地前 ACP 四新工具降级仅
      # PM_MCP_READ；默认空 = fail-closed；V-05-1 后移除。
      AI_PM_MCP_LEGACY_PERMISSION_GRANT: "${AI_PM_MCP_LEGACY_PERMISSION_GRANT:-}"
    ports:
      - "8090:8090"
    depends_on:
      aipm-pg:
        condition: service_healthy
      token-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - superpowers

  pm-worker:
    image: ${AIPM_REGISTRY:-aipm}/pm-worker:${AIPM_VERSION:-0.1.0}
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      # DK-F：与分析完成→自动开访谈同一个开关（D-DK-9 / DK-E）。
      # pm-worker 只消费 `kb.analysis.completed`（不跑编排循环），但两个
      # worker 必须同值——否则谁领到事件谁决定是否开访谈。
      AI_PM_DISCOVERY_ORCHESTRATOR: ${AI_PM_DISCOVERY_ORCHESTRATOR:-off}
      # deploy key 私钥解密主密钥（与 pm-api 同值）；KB 仓库快照分析在 worker 侧执行。
      AI_PM_SECRET_KEY: "${AI_PM_SECRET_KEY:-}"
    depends_on:
      aipm-pg:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - superpowers

  ai-pm-worker:
    image: ${AIPM_REGISTRY:-aipm}/ai-pm-worker:${AIPM_VERSION:-0.1.0}
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      AI_PM_POLICY_FILE: /app/policies/ai-pm-ai-lead-v2.yaml
      # D-1=b：无人值守派发开关（缺省 off）与项目级排除列表（逗号分隔 project code，
      # 缺省空）。透传后可由 .env.prod 开关而无需重建镜像；仅 ai-pm-worker 消费
      # （pm-worker 是纯 outbox 分发，不参与 Run 调度）。
      AI_PM_RUN_DISPATCH: ${AI_PM_RUN_DISPATCH:-off}
      AI_PM_RUN_DISPATCH_EXCLUDE_PROJECTS: ${AI_PM_RUN_DISPATCH_EXCLUDE_PROJECTS:-}
      # DK-F：第八循环（访谈编排器）开关（D-DK-9，缺省 off）。on 时本 worker
      # 跑编排轮次 + 写回钩子（需求草案止步 pending_confirmation + draft 任务批）。
      AI_PM_DISCOVERY_ORCHESTRATOR: ${AI_PM_DISCOVERY_ORCHESTRATOR:-off}
      # DK-F：第七循环（对话框 AI 回复）开关，缺省 off。
      AI_PM_CONVERSATION_REPLY: ${AI_PM_CONVERSATION_REPLY:-off}
      # DK-F：知识 Git 根（需求修订 Markdown 的绑定点）。缺省 <cwd>/../ai-pm-knowledge，
      # 容器内落在容器文件系统——重建即丢，故显式给可持久路径。
      AI_PM_KNOWLEDGE_ROOT: ${AI_PM_KNOWLEDGE_ROOT:-/data/knowledge}
    volumes:
      - aipm_knowledge:/data/knowledge
    depends_on:
      aipm-pg:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - superpowers

  # ai-frontend（本仓 ai-frontend/）：生产静态站（nginx 伺服 vite 产物，
  # /api 与 /gw 都反代 api-gateway:3000——见 ai-frontend/docker/nginx.conf；
  # Docker 内嵌 DNS 惰性解析，启动不依赖 upstream 存活，无需 depends_on）
  ai-frontend-web:
    image: ${AIPM_REGISTRY:-aipm}/ai-frontend-web:${AIPM_VERSION:-0.1.0}
    ports:
      - "8092:80"
    restart: unless-stopped
    networks:
      - superpowers

volumes:
  # DK-F：知识 Git 根（Markdown 真源）——需求修订的提交/绑定写这里，
  # 容器重建即丢会让历史修订的 git sha 不可寻址，故命名卷持久化。
  aipm_knowledge:
    name: infrastructure_aipm_knowledge
networks:
  superpowers:
    external: true
