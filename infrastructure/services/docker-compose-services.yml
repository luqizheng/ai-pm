# ── 服务自注册 + 日志采集公共契约（2026-11-06 与 lmms 对齐：registrator 退役） ──
# 注册：pm-api 等服务进程经 vendor/digua-common-consul 读 CONSUL_ADDR/
#       SERVICE_NAME/SERVICE_PORT/SERVICE_HEALTH_PATH → 启动注册、SIGTERM 注销、
#       30s 对账重注册。不再使用 Docker labels（SERVICE_* labels 已删除）。
# 跨主机：CONSUL_ADDR 指 infra 机 IP、SERVICE_ADDRESS 设本机 LAN IP（consul
#       健康检查回拨地址；空值回退容器 hostname，合体单机部署留默认即可）。
# 日志：promtail（observability staging overlay）只发现 logging=loki 容器。
# ⚠️ 本文件与 docker-compose.ai-pm.yml 各有一份同名 anchor（YAML anchor 不能
#    跨 include 文件），改动须两处同步。
x-consul-env: &consul-env
  CONSUL_ADDR: "${CONSUL_ADDR:-http://consul:8500}"
  SERVICE_ADDRESS: "${SERVICE_ADDRESS:-}"
  SERVICE_HEALTH_PATH: "/health"

x-loki-labels: &loki-labels
  logging: "loki"
  env: "staging"


services:
  file-service:
    image: ${kudi_repos:-zhcoder-docker-registry.com:8000/micro-server}/file-service:${IMAGE_TAG_PG:-1.7.0-pg}
    ports:
      - 8086:8082
    labels:
      <<: *loki-labels
      service: file-service
    environment:
      <<: *consul-env
      SERVICE_PORT: "8082"
      JWKS_URL: ${JWKS_URL}
      DATABASE_URL: ${DATABASE_URL}
      STORAGE_PATH: /var/lib/file-service/storage
      RUST_LOG: info
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      SERVICE_NAME: file-service
    volumes:
      - file-storage:/var/lib/file-service/storage
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - superpowers
  api-gateway:
    image: ${kudi_repos:-zhcoder-docker-registry.com:8000/micro-server}/api-gateway:${IMAGE_TAG_GATEWAY:-1.7.0}
    ports:
      - 3000:3000
    labels:
      <<: *loki-labels
      service: api-gateway
    environment:
      <<: *consul-env
      SERVICE_PORT: "3000"
      GW_SERVER_HOST: 0.0.0.0
      GW_SERVER_PORT: '3000'
      GW_REDIS_URL: redis://redis:6379
      GW_REDIS_PREFIX: 'superpowers:'
      GW_CONSUL_ADDR: http://consul:8500
      GW_JWKS_URL: http://token-service:8082/.well-known/jwks.json
      GW_ISSUER: superpowers-token-service
      GW_ROUTES_DIR: /app/config/api-gateway/routes
      GW_EVENT_BUS_URL: amqp://guest:guest@rabbitmq:5672/%2f
      RUST_LOG: api_gateway=trace,info
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      SERVICE_NAME: api-gateway
    volumes:
      - ./config/api-gateway/routes:/app/config/api-gateway/routes
      - ./config/api-gateway/api-gateway.toml:/app/config/api-gateway.toml:ro
      - ./config/api-gateway/rate-limits.toml:/app/config/api-gateway/rate-limits.toml:ro
    depends_on:
      consul:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      token-service:
        condition: service_healthy
    networks:
      - superpowers
  token-service:
    image: ${kudi_repos:-zhcoder-docker-registry.com:8000/micro-server}/token-service:${IMAGE_TAG_PG:-1.7.0-pg}
    ports:
      - 8082:8082
    labels:
      <<: *loki-labels
      service: token-service
    volumes:
      - ../../services/token-service/config:/app/config:ro
    environment:
      <<: *consul-env
      SERVICE_PORT: "8082"
      SERVICE_BOOTSTRAP_TOKENS: ${SERVICE_BOOTSTRAP_TOKENS}
      TENANT_ID: ${TENANT_ID}
      SWAGGER_ENABLED: 'true'
      SERVICE_NAME: token-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      TOKEN_DATABASE_URL: ${DATABASE_URL}
      TOKEN_DATABASE_DB_TYPE: postgres
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - superpowers
  iam-service:
    image: ${kudi_repos:-zhcoder-docker-registry.com:8000/micro-server}/iam-service:${IMAGE_TAG_PG:-1.7.0-pg}
    ports:
      - 9081:8081
    labels:
      <<: *loki-labels
      service: iam-service
    volumes:
      - ../../services/iam-service/config:/etc/iam-service
    environment:
      <<: *consul-env
      SERVICE_PORT: "8081"
      SERVICE_BOOTSTRAP_TOKEN: ${IAM_DEV_BT}
      TENANT_ID: ${TENANT_ID}
      TOKEN_SERVICE_URL: ${TOKEN_SERVICE_URL}
      JWKS_URL: ${JWKS_URL}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://${REDIS_HOST}:${REDIS_PORT}
      CONFIG_PATH: /etc/iam-service/config.yaml
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      SERVICE_NAME: iam-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - superpowers
  iam-outbox-publisher:
    image: ${kudi_repos:-zhcoder-docker-registry.com:8000/micro-server}/iam-service:${IMAGE_TAG_PG:-1.7.0-pg}
    command:
      - iam_outbox_publisher
    restart: unless-stopped
    labels:
      - logging=loki
      - service=iam-outbox-publisher
      - env=staging
    volumes:
      - ../../services/iam-service/config:/etc/iam-service
    environment:
      DATABASE_URL: ${DATABASE_URL}
      EVENT_BUS_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@${RABBITMQ_HOST}:${RABBITMQ_PORT}/%2f
      EVENT_BUS_EXCHANGE: events
      OUTBOX_POLL_INTERVAL_MS: '1000'
      OUTBOX_BATCH_SIZE: '100'
      CONFIG_PATH: /etc/iam-service/config.yaml
      METRICS_FILE_PATH: /var/run/prometheus/iam_outbox.prom
    healthcheck:
      test:
        - CMD-SHELL
        - f="$${METRICS_FILE_PATH:-/var/run/prometheus/iam_outbox.prom}"; [ -f "$$f" ] && [ $$(( $$(date +%s) - $$(stat -c %Y "$$f") )) -le 60 ]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - superpowers
  prue_backend:
    image: ${kudi_repos:-zhcoder-docker-registry.com:8000/micro-server}/prue-admin-backend:${IMAGE_TAG_PG:-1.7.0-pg}
    ports:
      - 8087:8087
    labels:
      <<: *loki-labels
      service: prue_backend
    environment:
      <<: *consul-env
      SERVICE_PORT: "8087"
      JWKS_URL: ${JWKS_URL}
      DATABASE_URL: ${DATABASE_URL}
      RUST_LOG: info
      SERVICE_NAME: prue_backend
      SERVER_PORT: '8087'
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - superpowers
  notification-service:
    image: ${kudi_repos:-zhcoder-docker-registry.com:8000/micro-server}/notification-service:${IMAGE_TAG_PG:-1.7.0-pg}
    ports:
      - 8083:8083
    labels:
      <<: *loki-labels
      service: notification-service
    volumes:
      - ../../services/notification-service/config:/etc/notification-service
    environment:
      <<: *consul-env
      SERVICE_PORT: "8083"
      CONFIG_PATH: /etc/notification-service/config.yaml
      SERVICE_BOOTSTRAP_TOKEN: ${NOTIFICATION_DEV_BT}
      TENANT_ID: ${TENANT_ID}
      TOKEN_SERVICE_URL: ${TOKEN_SERVICE_URL}
      JWKS_URL: ${JWKS_URL}
      EVENT_BUS_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@${RABBITMQ_HOST}:${RABBITMQ_PORT}/%2f
      SERVER_PORT: '8083'
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://${REDIS_HOST}:${REDIS_PORT}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      SERVICE_NAME: notification-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - superpowers
  notification-outbox-publisher:
    image: ${kudi_repos:-zhcoder-docker-registry.com:8000/micro-server}/notification-service:${IMAGE_TAG_PG:-1.7.0-pg}
    command:
      - ntf_outbox_publisher
    restart: unless-stopped
    labels:
      - logging=loki
      - service=notification-outbox-publisher
      - env=staging
    environment:
      DATABASE_URL: ${DATABASE_URL}
      EVENT_BUS_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@${RABBITMQ_HOST}:${RABBITMQ_PORT}/%2f
      EVENT_BUS_EXCHANGE: events
      OUTBOX_POLL_INTERVAL_MS: '1000'
      OUTBOX_BATCH_SIZE: '100'
      METRICS_FILE_PATH: /var/run/prometheus/ntf_outbox.prom
    healthcheck:
      test:
        - CMD-SHELL
        - f="$${METRICS_FILE_PATH:-/var/run/prometheus/ntf_outbox.prom}"; [ -f "$$f" ] && [ $$(( $$(date +%s) - $$(stat -c %Y "$$f") )) -le 60 ]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - superpowers
  audit-service:
    image: ${kudi_repos:-zhcoder-docker-registry.com:8000/micro-server}/audit-service:${IMAGE_TAG_PG:-1.7.0-pg}
    ports:
      - 8084:8084
    labels:
      <<: *loki-labels
      service: audit-service
    environment:
      <<: *consul-env
      SERVICE_PORT: "8084"
      JWKS_URL: ${JWKS_URL}
      DATABASE_URL: ${DATABASE_URL}
      EVENT_BUS_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@${RABBITMQ_HOST}:${RABBITMQ_PORT}/%2f
      REDIS_URL: redis://${REDIS_HOST}:${REDIS_PORT}
      RUST_LOG: info
      SERVICE_NAME: audit-service
      SERVER_PORT: '8084'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - superpowers

volumes:
  file-storage:
    name: infrastructure_file-storage
networks:
  superpowers:
    external: true
