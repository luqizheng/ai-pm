# 2026-11-07 file-service 收口配套（lmms 8ec689d0）：file-service 已收口为
# 纯内部服务（/file/* 只认 service-jwt，aud=file-service），用户面入口改为
# pm-api 的文件代理（apps/pm-api/src/files.rs，出站按请求租户铸 service-jwt
# 调 file-service，user_id 由鉴权层覆写）。公共 API 路径 /v1/file/* 保持
# 不变——下游从 file-service 换成 pm-api，前端 TS SDK（sdk/file-services，
# baseUrl=/gw）零改动。
# /health 仍直连 file-service（public 探针）。
[[route]]
upstream   = "/v1/file/health"
downstream = "/health"
service    = "file-service"
public     = true

[[route]]
upstream   = "/v1/file/upload"
downstream = "/v1/file/upload"
service    = "pm-api"

[[route]]
upstream   = "/v1/file/list"
downstream = "/v1/file/list"
service    = "pm-api"

[[route]]
upstream   = "/v1/file/presign"
downstream = "/v1/file/presign"
service    = "pm-api"

[[route]]
upstream   = "/v1/file/{rest}"
downstream = "/v1/file/{rest}"
service    = "pm-api"
