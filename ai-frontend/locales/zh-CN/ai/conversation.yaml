title: AI-PM 会话
pinned: 已固定上下文
contextLabel: 世界地图渲染 v2.0 · 森林生成
intro: 会话把轻量信息保留为普通消息，只有结构化交互才升级为内联响应卡；输入栏固定在底部，固定上下文始终可见。
composer:
  placeholder: 继续追问，或直接回答 AI-PM…
  attach: 添加附件
  send: 发送
  hint: Enter 发送 · Shift + Enter 换行
prototype:
  heading: 原型 A–H — 会话内交互
  hint: 每帧对应交付清单中的一个真实交互；控件可点，状态真实变化。
  a: 点击 Accept 后卡片保留并转为只读记录，显示记录号与摘要。
  b: 点击 Reject 展开原因输入；原因随结果一起记录。
  c: 多选题可一次勾选多个选项，答案保留草稿。
  d: 点击 Edit 进入编辑模式，修改并保存后显示编辑标记。
  e: 多题同卡；必填项未完成时阻止提交并高亮第一处。
  f: 选择选项并勾选「以本人身份提交」，经二次确认后记录正式决策。
  g: 高后果操作经确认弹层二次确认；后端确认前不显示成功。
  h: 请求修改需填写原因；提交后卡片保留执行结果不变。
