design:
  index:
    title: 设计系统目录
    subtitle: AI R&D Workspace — Figma 设计稿的可浏览实现（组件 / 导航 / 应用壳）
    hint: 深色为默认主题；右上角可切换浅色预览。
    sectionTokens: 令牌
    sectionComponents: 组件族（DS）
    sectionNavigation: 导航（Figma 板）
    sectionShell: 应用壳
    sectionAiInteraction: AI 交互组件库
    sectionSettings: Settings 框架
  theme:
    toggle: 切换浅色 / 深色预览
  aiInteraction:
    index:
      title: 总览 — 架构 / 生命周期 / 帧索引
      subtitle: 统一响应卡 + 8 类响应 + 交互控件 + 会话集成（交付清单 16 帧）
      archTitle: 架构
      archBaseTitle: 统一卡片基座
      archBaseText: 所有交互共用同一响应卡；Header / Summary / Content / Evidence / Interaction / Footer 按需出现，不强迫每张卡都带全部段位。
      archTypesTitle: 8 类响应
      archTypesText: 信息、建议、提案、问题、决策、产物、操作确认、执行结果；类型只决定交互区与页脚动作，不改变卡片骨架。
      archControlsTitle: 控件与会话
      archControlsText: 21 个可复用控件承载选择、反馈、编辑、决策与流程；会话里普通信息保持轻量消息，只有结构化交互才升级为卡片。
      lifecycleTitle: 交互生命周期（11 态）
      framesTitle: 交付帧索引
      framesHint: 每行对应交付清单中的画框；点击进入对应目录页（真实组件渲染，可交互）。
    base:
      title: 卡片基座 — 统一响应卡解剖
      subtitle: Header / Summary / Content / Evidence / Interaction / Footer 六段，按需出现
    informational:
      title: 信息响应 — 分析与来源
      subtitle: 只读信息卡，不带多余审批动作
    recommendation:
      title: 建议响应 — 待处理 / 已接收 / 已拒绝
      subtitle: 接收只记录选择，不声称业务已生效
    proposal:
      title: 提案响应 — 评审 / 编辑与对比
      subtitle: 提案接收与正式审批分离
    question:
      title: 问题卡 — 多题一卡 / 校验 / 已提交
      subtitle: 多题同卡提交，未完成答案保留草稿
    decision:
      title: 决策卡 — 待决策 / 已记录
      subtitle: AI 推荐、用户选择、正式决策三者可辨
    artifact:
      title: 产物响应 — 预览 / 版本 / 差异
      subtitle: 需求文档、技术设计、项目计划、测试计划等
    action:
      title: 操作确认 — 高后果动作
      subtitle: 后端确认成功前不显示成功
    execution:
      title: 执行结果 — 变更 / 失败与重试
      subtitle: 外部 Agent 执行结果、变更文件、日志与告警
    controls:
      title: 控件库 — 交互控件全状态
      subtitle: 选择 / 反馈 / 编辑 / 决策 / 流程五族，默认至已提交八态
    conversation:
      title: 会话集成 — 消息时间线
      subtitle: 固定输入栏 + 右上下文栏 + 内联交互卡（原型 A–H）
  tokens:
    title: 设计令牌
    subtitle: 视觉数值唯一真源 = src/styles/tokens.css；本页只读展示。
    colors: 颜色
    typography: 字阶
    controls: 控件尺寸
    spacing: 间距 / 圆角
  components:
    buttons:
      title: Buttons — 按钮族
      subtitle: Button（13:32697）+ IconButton（13:32734）
    forms:
      title: Forms — 表单族
      subtitle: TextInput / Password / Search / Select / Checkbox / Radio / Switch / Textarea / DatePicker
    navigation:
      title: Navigation — 导航族
      subtitle: SidebarItem / NavigationGroup / TopBarItem / Breadcrumb / Tab
    overlays:
      title: Overlays — 浮层族
      subtitle: ConfirmationDialog / Dialog / Popover / DropdownMenu / Command
    feedback:
      title: Feedback — 反馈族
      subtitle: StatusIndicator / ProgressIndicator / EmptyState + Badge / Alert / Toast / Skeleton
    data:
      title: Data — 数据族
      subtitle: AvatarGroup / ListItem / NotificationItem / MenuItem + Avatar
    ai:
      title: AI — AI 族
      subtitle: EntryButton / CommandInput / Suggestion / AI Status / HumanApproval（AI 建议 accent、人工确认次文字）
  navigation:
    global:
      title: 全局导航 — 展开 / 折叠
      subtitle: Figma 板 01/02 — 真实应用壳渲染（1440×900 画框，可点击折叠按钮切换两态）
    contexts:
      title: 三种导航上下文
      subtitle: Figma 板 03/04/05 — 个人 / 项目 / 管理（DS 组件组合，不混成扁平菜单）
    switcher:
      title: 项目上下文切换器
      subtitle: Figma 板 06 — Project Context Switcher — TopBarSlice / Trigger 五态 / Menu 五反馈态（双主题）
    states:
      title: 导航交互状态
      subtitle: Figma 板 06/08 — Navigation Item / Group / Badge / Tooltip / Context Header 全状态
    switching:
      title: 项目切换序列
      subtitle: Figma 板 07 — Before / Switching / After 差异对照（静态）
    library:
      title: 导航组件库
      subtitle: Figma 板 08 — 9 族 24 specimen
  shell:
    states:
      title: 应用壳状态
      subtitle: Figma 板 03 Shell states — 五区域尺寸契约与控制状态条
  specimen:
    states: 状态
    sizes: 尺寸
    variants: 变体
    interactionHint: 悬停 / 聚焦可实际交互
  notes:
    board02: Board 02 — Collapsed（7:15058）：点击左下角折叠按钮切换；折叠后 60px 纯图标 + 分隔线 + 未读圆点，tooltip 悬停可见。
    contexts: Boards 的英文标签为设计参考文本（specimen 标注）；业务落地的中文文案以 src/router/navigation.ts + locales 为单源，不在此复刻。
    switching: 面包屑 / 页面标题 / AI 指令文案随上下文改写（Atlas → Research Sandbox）；GLOBAL 组常驻；Loading 行文案 Switching project…（板 07 规格原文）。
