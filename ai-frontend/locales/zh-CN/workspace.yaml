    bootstrap:
      title: 环境接入
      pill: 支持自动初始化
      desc: 将以下指令发送给 Codex，即可初始化当前开发环境（技能安装、MCP 配置、设备登记与自检全程无手工编辑配置文件）。
      instruction:
        title: PM-AI Bootstrap
        body: |-
          请初始化当前开发环境。
          1. 阅读 PM-AI 安装说明（安装地址见下）。
          2. 检查当前执行端与操作系统环境。
          3. 安装 PM-AI 技能包，并按说明写入本工具的 MCP 配置（需要 API Key 时向我索取；Key 不得出现在安装指令或 URL 中）。
          4. 按说明验证平台连通（/health 与 /v1/pm/me）。
          5. 引导我确认要绑定的 Project，登记本设备并验证仓库访问。
          6. 执行完整环境自检，并把结果提交给平台。
          7. 确认开发环境达到 Ready 状态后结束。
        urlLabel: 安装地址：
      copy: 复制初始化指令
      copied: 已复制
      copyFailed: 复制失败，请手动选择文本复制
      replaceHint: 示例地址，正式环境请替换为 PM-AI 的实际部署地址。
