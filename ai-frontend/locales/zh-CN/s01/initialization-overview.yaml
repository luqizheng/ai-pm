      ai: "AI 正在推进{stage}"
      system: "系统正在处理{stage}"
    needsUser: 需要你操作
    noUserAction: 无需你操作，系统会自动推进
    remaining: "另有 {count} 项同类事项"
    open: 查看详情
  handover:
    ready: 可以进入项目总控台
