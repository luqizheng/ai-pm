    projectBasics:
      title: 创建项目
      hint: 项目身份已建立，创建表单由项目创建页负责。
    repository:
      title: 仓库接入与代码分析
      hint: 尚未关联仓库。零仓库是合法状态，不阻塞其他阶段。
      detail: "共 {total} 个仓库，其中 {verified} 个已验证"
    cognition:
      title: AI-PM 认知
      hint: 尚未建立项目认知。分析结论需经人工确认才成为项目事实。
    baseline:
      title: 基线确认
      hint: 尚未生成基线提案。基线必须由人类正式确认。
      detailConflict: 存在需要人工裁决的冲突项。
      detailAwaiting: 等待认知分析产出后生成提案。
      detailPending: "有 {count} 项认知结果待人工确认。"
    environment:
      title: Codex / MCP 接入
      hint: 开发环境尚未接入。设备就绪状态需设备自检后核验。
    handover:
      title: 初始化交接
      hint: 初始化尚未收口，剩余事项将在项目总控台持续跟踪。
    source: 来源
    sourceEmpty: 暂无权威来源
    derivedNote: 该阶段由已有事实合成，尚未有专属后端数据源。
    dependsOn: "依赖：{stage}"
    independent: 可独立推进
    open: 进入阶段详情
    noRoute: 暂无可下钻页面
