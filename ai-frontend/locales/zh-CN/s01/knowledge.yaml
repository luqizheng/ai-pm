    synthesisFailed: 身份综合失败（访谈/报告不足或模型不可用）
    status:
      analyzing: 分析中
      analyzed: 待审理
      closed: 已关闭
      failed: 失败
      cancelled: 已取消
    empty: 暂无分析报告——仓库分析完成后在此可见
    analyzingHint: 采集中…
    pendingItems: "{n} 项待处置"
    allDisposed: 已全部处置，可关闭
    closedAt: 关闭于 {time}
    failedReason: 分析失败
    loading: 报告加载中…
    kbSec: 分析报告（KB 修订 v{no} · {status}）
    kbMissing: 本次分析未产出 KB 报告修订
    proposalSec: PC 提案（{n}）
    noProposals: 本次分析未起草提案
    pcSec: PC 对象修订（{n}）
