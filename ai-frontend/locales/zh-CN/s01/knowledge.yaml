knowledge:
  page:
    title: 知识库
    description: KB 文档（含发布确认）与 PC 认知对象的统一浏览面。
  tab:
    kb: KB 文档
    pc: PC 对象
    projc: ProjC 对象
  status:
    draft: 草稿
    published: 已发布
    rejected: 已拒绝
    empty: 无修订
  lifecycle:
    identity: 占位
    draft: 草稿
    active: 现行
    deprecated: 已废弃
    superseded: 已替代
  field:
    revision: 修订
    revisions: 修订历史
    content: 正文
  detail:
    noRevision: 暂无修订——对象为 identity 占位，提案应用后在此可见全文
    analysisMode: 分析模式
    versioned: 已入正式版本
    unversioned: 未入正式版本
    sourceAnalysis: 来源分析
    sourceAnalysisNone: 非报告通道发布
    openReport: 查看报告
  action:
    confirm: 确认发布
    confirming: 确认中…
  notice:
    ingested: 已摄入为草稿（修订 {no}）——请在详情中确认发布
    confirmed: 已确认发布（同人重复确认不会改原确认记录）
  error:
    ingestKey: 请填写文档标识
    ingestContent: 请提供文件或粘贴内容
    ingest: 摄入失败（解析或网络）
    load: 加载失败，请稍后重试
    confirm: 确认失败（需要真人交互登录态；AI / API Key 无确认权）
  hint:
    loading: 加载中…
    emptyKb: 暂无 KB 文档——分析产物经确认后在此可见
    emptyPc: 暂无 PC 认知对象——提案发布后在此可见
    emptyProjc: 暂无项目技术认知对象——ProjC 提案发布（报告关闭）后在此可见
    emptyProposals: 暂无提案——AI 分析起草或人工创建后在此可见
  impact:
    title: 影响分析（跨域关系遍历）
    placeholder: 例如：修改订单状态会影响哪些需求与设计？
    run: 分析
    running: 分析中…
    degraded: 规划器未介入（{reason}）——已用固定双域策略
    noEdges: 未找到正式关系路径（gaps 见下）
    gap: 缺口
  ingest:
    title: 摄入文档（解析 → 草稿）
    pickFile: 选择文件（.md / .txt / .docx）
    switchPaste: 改为粘贴文本
    docKey: 文档标识（如 payment-spec）
    pastePlaceholder: 直接粘贴 Markdown 文本…
    typeKnowledge: 知识
    typeArchitecture: 架构
    typeDecision: 决策
    typeRequirement: 需求
    run: 摄入为草稿
    running: 解析中…
    hint: 摄入只生成草稿——不会进入检索，需在详情中确认发布后才生效。
