    closeConfirmDescription: 将对 {repo} 的这份报告自动驳回 {proposals} 个未决提案、拒绝 {kb} 份 KB 草稿，并固化分析锚点；关闭后该仓库可再次分析。
    closeNotice: 报告已关闭——分析锚点已固化（{commit}），该仓库可再次分析
    closeError: 关闭失败
