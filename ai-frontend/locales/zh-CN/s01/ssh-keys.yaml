ssh-keys:
  page:
    title: SSH 私钥
    description: 管理项目级 Git 私钥：粘贴导入、改名、删除。仓库用哪把在【仓库】设置的详情面板里选。
  list:
    title: 密钥（{active} 把可用 / 共 {total} 把）
    statusConfigured: 已配置
