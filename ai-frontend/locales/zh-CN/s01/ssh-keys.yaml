    empty: 还没有密钥。在下方粘贴一把私钥开始。
    default: 默认
    revoked: 已吊销
  action:
    refresh: 刷新
    rename: 改名
    renameSave: 保存
    renameCancel: 取消
    delete: 删除
    deleteArmed: 确认删除？
    copyPublicKey: 复制公钥
    copied: 已复制
  form:
    title: 添加密钥
    nameLabel: 名称
    namePlaceholder: 例如 github-main
    inputLabel: 粘贴私钥
    submit: 保存密钥
    hint: 粘贴可读取 Git 仓库的 OpenSSH 私钥（ed25519 / RSA / ECDSA）。私钥加密存储且不再显示；同名保存会替换那把密钥，第一把自动成为项目默认。
  error:
    labelTaken: 该名称已被同项目另一把密钥使用，换一个名称。
    referenced: 该密钥仍被仓库绑定引用，请先在【仓库】设置中解绑。
    failed: 操作失败：{message}
