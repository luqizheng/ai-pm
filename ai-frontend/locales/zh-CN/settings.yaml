      p1: 一个设置项只属于一个主域，不跨域复用语义。
      p2: 权限控制可见性与可编辑性；无授权的条目不出现。
      p3: 能力未经产品确认的条目标记「规划中」，不冒充既有功能。
      p4: 页面模板与表单控件全量复用 Settings 组件与 ui 基座。
      p5: 高影响配置不自动保存；敏感操作显式确认。
