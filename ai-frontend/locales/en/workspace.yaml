    bootstrap:
      title: Environment Setup
      pill: Auto-setup supported
      desc: Send the instruction below to Codex to initialize this dev environment (skill install, MCP config, device registration and checks — no manual config editing).
      instruction:
        title: PM-AI Bootstrap
        body: |-
          Please initialize the current dev environment.
          1. Read the PM-AI install guide (address below).
          2. Inspect the current executor and OS environment.
          3. Install the PM-AI skill pack and write this tool's MCP config per the guide (ask me for the API key when needed; the key must never appear in the instruction or URL).
          4. Verify platform connectivity per the guide (/health and /v1/pm/me).
          5. Ask me which Project to bind, register this device and verify repository access.
          6. Run the full environment self-check and submit the result to the platform.
          7. Finish once the environment reaches Ready.
        urlLabel: "Install URL:"
      copy: Copy install instruction
      copied: Copied
      copyFailed: Copy failed — please select and copy the text manually
      replaceHint: Example address; replace with the actual PM-AI deployment address in production.
