knowledge:
  page:
    title: Knowledge Base
    description: Unified browsing for KB documents (with publish confirmation) and PC cognition objects.
  tab:
    kb: KB Documents
    pc: PC Objects
    projc: ProjC Objects
  status:
    draft: Draft
    published: Published
    rejected: Rejected
    empty: No revision
  lifecycle:
    identity: Identity
    draft: Draft
    active: Active
    deprecated: Deprecated
    superseded: Superseded
  field:
    revision: Rev
    revisions: Revisions
    content: Content
  detail:
    noRevision: No revision yet — the object is an identity placeholder; full content appears after a proposal is applied
    analysisMode: Analysis mode
    versioned: In published version
    unversioned: Not in a published version
    sourceAnalysis: Source analysis
    sourceAnalysisNone: Published outside the report channel
    openReport: Open report
  action:
    confirm: Confirm & Publish
    confirming: Confirming…
  notice:
    ingested: Ingested as draft (rev {no}) — confirm in the detail view
    confirmed: Published (repeat confirmation by the same user keeps the original record)
  error:
    ingestKey: Document key is required
    ingestContent: Provide a file or paste content
    ingest: Ingest failed (parse or network)
    load: Failed to load, please retry
    confirm: Confirmation failed (requires an interactive human session; AI / API keys cannot confirm)
  hint:
    loading: Loading…
    emptyKb: No KB documents yet — analysis drafts appear here after confirmation
    emptyPc: No PC cognition objects yet — they appear here after version publication
    emptyProjc: No project technical cognition objects yet — they appear here after ProjC proposals are published (report closed)
    emptyProposals: No proposals yet — AI drafts or manual creations appear here
  impact:
    title: Impact analysis (cross-domain traversal)
    placeholder: e.g. what requirements and designs does changing order status affect?
    run: Analyze
    running: Analyzing…
    degraded: Planner bypassed ({reason}) — fixed dual-domain strategy used
    noEdges: No formal relationship path found (see gaps)
    gap: Gap
  ingest:
    title: Ingest document (parse → draft)
    pickFile: Choose file (.md / .txt / .docx)
    switchPaste: Paste text instead
    docKey: Document key (e.g. payment-spec)
    pastePlaceholder: Paste Markdown text directly…
    typeKnowledge: Knowledge
    typeArchitecture: Architecture
    typeDecision: Decision
    typeRequirement: Requirement
    run: Ingest as draft
    running: Parsing…
    hint: Ingesting only creates a draft — it will not enter retrieval until confirmed in the detail view.
