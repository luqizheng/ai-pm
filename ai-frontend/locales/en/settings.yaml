  architecture:
    title: Settings Architecture Overview
    desc: A unified settings framework with three separated scopes — personal
      account, tenant administration, and project.
    scopesTitle: Three configuration scopes
    scopesDesc: Every setting belongs to exactly one primary scope; entry points,
      permissions, and data boundaries are isolated per scope.
    scope:
      personal:
        title: Personal Account Settings
        entry: Entry — Avatar → Account Settings
        desc: Display name, security, preferences, notifications, and personal AI
          interaction preferences.
      tenant:
        title: Tenant Administration Settings
        entry: Entry — Tenant Administration → Settings
        desc: Tenant identity, members & access, integrations, and governance.
          Restricted to users holding tenant permissions.
      project:
        title: Project Settings
        entry: Entry — Current Project → Project Settings
        desc: Project identity, members, repositories, development configuration, and
          project AI behavior.
    principlesTitle: Framework principles
    principles:
      p1: A setting belongs to exactly one primary scope; semantics are never reused
        across scopes.
      p2: Permissions govern visibility and editability; unauthorized entries never
        appear.
      p3: Items whose product capability is unconfirmed are marked "Proposed", never
        presented as existing features.
      p4: Page templates and form controls fully reuse Settings components and the ui
        foundation.
      p5: High-impact configuration never auto-saves; sensitive actions require
        explicit confirmation.
    legendProposed: Proposed = design placeholder for an unconfirmed capability
    framesTitle: Frame index
