    title: Runtime Information
    platform: Platform
    osVersion: OS version
    executorKind: Executor
    executorVersion: Executor version
    deviceId: Device ID
    createdAt: Registered at
    lastCheckAt: Last check
  danger:
    title: Danger Zone
    description: Revoking the device immediately blocks new execution authorization; running Runs follow the platform termination and cleanup lifecycle.
    revoke: Revoke device authorization
    revokedTitle: Device revoked
    revokedAt: Revoked at
  revoke:
    title: Revoke authorization for {id}?
    description: Once revoked the device immediately loses execution authorization and its project bindings are deactivated. Recovery requires re-registration. This action is audited.
    checkbox: I understand the impact (running Runs will be terminated and cleaned up per the platform lifecycle).
    confirm: Revoke authorization
    cancel: Cancel
