    title: Add Execution Environment
    stepOf: "Step {step} / {total}"
    step1Title: Select device platform
    step2Title: Download and install the Runner
    step2Desc: Open the install guide for your platform; the package and commands follow the guide.
    step2Hint: The install guide runs local prerequisite checks (OS version / dependencies / network).
    step3Title: Register and verify
    step3Desc: After registration the device-side Runner performs connection, authentication and repository checks; readiness is computed server-side.
    notReadyNote: Installation ≠ registration ≠ Execution Ready — the device receives no tasks until registration and verification pass.
    copy: Copy
    copied: Copied
    back: Back
    next: Next
    submit: Register device
    done: Done
    goDetail: View device detail
    successTitle: Device registered
    successDesc: Device {id} joined the execution environment directory. It becomes bindable once the Runner connects and reports checks.
    platformHint:
      windows: Windows 10 or later
      macos: macOS 12 or later
      linux: Ubuntu 22.04 / Debian 12
    field:
      name: Device name
      osVersion: OS version
      executorKind: Executor
      executorVersion: Executor version
  banner:
    ready:
      title: Execution Ready
      description: The latest self-check passed end to end — the device can receive execution tasks for its bound projects.
    degraded:
      title: Degraded
      description: The latest self-check reported issues; new Runs are held back. The device returns to ready after it recovers and re-reports checks.
    failed:
      title: Failed
      description: Execution is unavailable. Troubleshoot the device with the install guide, then let the Runner re-report checks.
    unchecked:
      title: Unchecked
      description: The device is registered but has not reported a self-check yet; execution authorization is not in effect.
    progress:
      title: Onboarding in progress
      description: The readiness snapshot has not reached Ready — finish installation, connection and authentication, then the device-side check updates the snapshot.
    revoked:
      title: Revoked
      description: This device has been revoked and is blocked from new execution authorization. Re-register the device to restore access.
  health:
    title: Runtime Health
    installed: Runner Installed
    connected: Runner Connected
    tool: Execution Toolchain
    repository: Repository Permission
    authentication: Authentication
    repoCoverage: "Repository coverage {verified}/{declared}"
    note:
      pass: Passed in the latest self-check
      fail: Failed in the latest self-check — troubleshoot and re-check
      warning: Partially passed — waiting for device-side recovery
      unknown: No check evidence yet
    evidenceNote: Read-only view of the latest self-check evidence; checks are reported by the device-side Runner.
  bindings:
    title: Project Bindings
    permissionNote: Binding grants no additional project or repository permissions
    empty: No project bindings yet. Bind a project so this device can receive its execution tasks.
    bindCurrent: Bind current project
    bindDisabledHint: Select a specific project first to bind
    unbind: Unbind
    coverage: "Repository coverage {verified}/{declared}"
    boundAt: Bound at
    accessible: Accessible
    notAccessible: Not accessible
