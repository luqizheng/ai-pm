server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 生产 API 面（2026-11-05 架构口径）：pm 与 iam 一致挂 api-gateway 对外，
    # pm-api:8090 为容器网络内部端口不直接对外。网关边缘验 JWT 后按
    # pm.router.toml 路由 /v1/pm/* → pm-api（identity 映射），pm-api jwks 二次验证。
    # /api → 网关（剥 /api 前缀 → /v1/pm/*）；/gw → 网关（iam 链）。
    # Docker 内嵌 DNS 惰性解析：启动不依赖 upstream 存活（容器独立可起）。
    resolver 127.0.0.11 valid=30s;
    set $gw_upstream api-gateway:3000;
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$gw_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
    }
    location /gw/ {
        rewrite ^/gw/(.*)$ /$1 break;
        proxy_pass http://$gw_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA 回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（vite 产物带 hash）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
