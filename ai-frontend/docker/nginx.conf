server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 生产 API 面：/api → pm-api（strip /api 前缀，与 dev 代理同语义）
    #               /gw  → lmms api-gateway（iam 登录/JWKS 链）
    # compose 网络内经服务名解析；端口映射由部署层决定。
    # Docker 内嵌 DNS 惰性解析：启动不依赖 upstream 存活（容器独立可起）
    resolver 127.0.0.11 valid=30s;
    set $pm_api_upstream pm-api:8090;
    set $gw_upstream api-gateway:3000;
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$pm_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
    }
    location /gw/ {
        rewrite ^/gw/(.*)$ /$1 break;
        proxy_pass http://$gw_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA 回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（vite 产物带 hash）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
