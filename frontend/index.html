<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="renderer" content="webkit" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=0"
    />
    <title>AI-PM 平台</title>
    <link rel="icon" href="/favicon.ico" />
    <script>
      // 工作区主题防闪烁：必须在首帧前写入 data-theme（默认深色，用户裁决 2026-10-31）。
      // 键值与 src/workspace/useTheme.ts 的 THEME_STORAGE_KEY 一致。
      (function () {
        try {
          var t = localStorage.getItem("aipm.theme");
          document.documentElement.dataset.theme =
            t === "light" || t === "dark" ? t : "dark";
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>

  <body>
    <!--
      PRISM 壳的挂载点。
      这里曾有一段 pure-admin 的 loader 内联样式（#app 固定高 100% + overflow:hidden），
      会让整个壳无法滚动，已随壳重写一并移除。
    -->
    <div id="app"></div>
    <script type="module" src="/src/shell/entry.ts"></script>
  </body>
</html>
