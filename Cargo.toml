[workspace]
resolver = "2"
members = [
    "crates/*",
    "apps/*",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
# HTTP layer
axum = "0.8"
# Database (no TLS feature: local Postgres only; no offline mode, `query!` macros are banned)
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "chrono",
    "uuid",
    "json",
    "macros",
    "migrate",
] }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# IDs and time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
# Errors and traits
thiserror = "2"
async-trait = "0.1"
# Content hashing (inbound event payload fingerprint)
sha2 = "0.10"
# Service abstractions (tower::ServiceExt::oneshot for route tests)
tower = { version = "0.5", features = ["util"] }
# HTTP client (native-tls = schannel on Windows, zero C compilation dependencies)
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
# MCP SDK
rmcp = { version = "3.8", features = ["server", "transport-io"] }
# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Dev dependencies
wiremock = "0.6"
