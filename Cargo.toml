[workspace]
resolver = "2"
members = [
    "crates/*",
    "apps/*",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

# dev 档位：工作区 debug = 1（行表，panic 仍有「文件:行号」），依赖不带
# 调试信息。dev 默认的完整 DWARF 是编译时间与 target 体积的大头（本仓
# 实测 target 53G），服务端项目日常不做变量级调试。要逐变量排查某个依赖
# 时，临时给那**一个**包加 debug = 2。
[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = false

# clippy 专用 profile：lint 只做 HIR/MIR 静态分析，产物直接丢弃。
# dev 默认带完整 debuginfo（debug = true），编译与落盘都为此付费，而 clippy
# 完全用不上；这里关掉调试信息、保持 O0。lint 结论与 opt-level 无关，
# 门禁语义不变。用法：cargo lint ...（别名见 .cargo/config.toml）。
[profile.clippy]
inherits = "dev"
debug = 0

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
quick-xml = "0.42"
zip = { version = "3.0", default-features = false, features = ["deflate"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Async runtime
tokio = { version = "1", features = ["full"] }
# HTTP layer
axum = { version = "0.8", features = ["multipart", "macros"] }
# SSE: broadcast receiver -> Stream adapter
tokio-stream = { version = "0.1", features = ["sync"] }
# Database (no TLS feature: local Postgres only; no offline mode, `query!` macros are banned)
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "chrono",
    "uuid",
    "json",
    "macros",
    "migrate",
] }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# IDs and time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
# Errors and traits
thiserror = "2"
async-trait = "0.1"
# Content hashing (inbound event payload fingerprint)
sha2 = "0.10"
# Secret at rest: AES-256-GCM for LLM provider API keys, CSPRNG for nonces
aes-gcm = "0.10"
getrandom = "0.3"
# Service abstractions (tower::ServiceExt::oneshot for route tests)
tower = { version = "0.5", features = ["util"] }
# HTTP client (native-tls = schannel on Windows, zero C compilation dependencies)
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
# MCP SDK
rmcp = { version = "3.8", features = ["server", "transport-io"] }
# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Dev dependencies
wiremock = "0.6"
# lmms 基座 crates（kellnr 私有 registry；token 在 ~/.cargo/credentials.toml [registries.kellnr]）
#
# 2026-11-09 起改走 kellnr 发行版，本仓不再维护 vendor/ 源码快照。两条理由：
#   ① 快照必漂移——本次核对发现仓内快照（common-jwt 取自 lmms @5022fd76）已
#      落后于 lmms 现行源码，而 kellnr 上的 1.6.0 更旧（common-jwt 的 per-tenant
#      铸造缓存整块缺失）；快照与发行版两头都不准。
#   ② 违背上游规约——lmms AGENTS.md「跨仓库分发」明写：发版 = 镜像 + 各种包，
#      下游走包升级，不做源码级同步。Rust 侧发布目标就是 kellnr。
# 升级方式：lmms 发新版 → cargo update -p digua_file_sdk（等 kellnr 索引可见）。
#
# TLS 后端：本仓 reqwest 钉 native-tls（Windows schannel / Linux openssl，零 C
# 编译依赖），所以这四个 crate 一律 default-features = false + tls-native。
# lmms 1.7.0 起把 TLS 后端做成可选 feature 轴（默认仍是 tls-rustls）；不关
# default features 的话 reqwest 会被 union 上 rustls-tls-webpki-roots，把
# aws-lc-sys（cmake + C 编译器）拖进本仓的构建机与容器镜像。
digua_common_jwt = { version = "1.7.0", registry = "kellnr", default-features = false, features = ["tls-native"] }
digua_common_consul = { version = "1.7.0", registry = "kellnr", default-features = false, features = ["tls-native"] }
digua_file_sdk = { version = "1.7.0", registry = "kellnr", default-features = false, features = ["tls-native"] }
