[workspace]
resolver = "2"
members = [
    "crates/*",
    "apps/*",
]

[workspace.package]
version = "1.0.0"
edition = "2021"

# dev 档位：工作区 debug = 1（行表，panic 仍有「文件:行号」），依赖不带
# 调试信息。dev 默认的完整 DWARF 是编译时间与 target 体积的大头（本仓
# 实测 target 53G），服务端项目日常不做变量级调试。要逐变量排查某个依赖
# 时，临时给那**一个**包加 debug = 2。
[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = false

# clippy 专用 profile：lint 只做 HIR/MIR 静态分析，产物直接丢弃。
# dev 默认带完整 debuginfo（debug = true），编译与落盘都为此付费，而 clippy
# 完全用不上；这里关掉调试信息、保持 O0。lint 结论与 opt-level 无关，
# 门禁语义不变。用法：cargo lint ...（别名见 .cargo/config.toml）。
[profile.clippy]
inherits = "dev"
debug = 0

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
quick-xml = "0.42"
zip = { version = "3.0", default-features = false, features = ["deflate"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Async runtime
tokio = { version = "1", features = ["full"] }
# HTTP layer
axum = { version = "0.8", features = ["multipart", "macros"] }
# URL parsing（team_llm endpoint 校验 §17 SSRF）
url = "2"
# SSE: broadcast receiver -> Stream adapter
tokio-stream = { version = "0.1", features = ["sync"] }
# Database (no TLS feature: local Postgres only; no offline mode, `query!` macros are banned)
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "chrono",
    "uuid",
    "json",
    "macros",
    "migrate",
] }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# IDs and time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
# Errors and traits
thiserror = "2"
async-trait = "0.1"
# Content hashing (inbound event payload fingerprint)
sha2 = "0.10"
# Secret at rest: AES-256-GCM for LLM provider API keys, CSPRNG for nonces
aes-gcm = "0.10"
getrandom = "0.3"
# Service abstractions (tower::ServiceExt::oneshot for route tests)
tower = { version = "0.5", features = ["util"] }
# HTTP client (native-tls = schannel on Windows, zero C compilation dependencies)
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
# MCP SDK
rmcp = { version = "3.8", features = ["server", "transport-io"] }
# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Dev dependencies
wiremock = "0.6"
# lmms 基座 crates（公开 crates.io 发行版）
#
# lmms 发版后，下游通过 crates.io 版本升级；不做源码级同步。
# 所有依赖保持 default-features = false + tls-native，避免意外引入
# rustls/aws-lc-sys 构建链并保持 reqwest 的 native-tls 后端一致。
digua_common_jwt = { version = "1.7.0", default-features = false, features = ["tls-native"] }
digua_common_consul = { version = "1.7.0", default-features = false, features = ["tls-native"] }
digua_file_sdk = { version = "1.7.0", default-features = false, features = ["tls-native"] }
