[package]
name = "pm-infrastructure"
version.workspace = true
edition.workspace = true

[dependencies]
kb-pc-contracts = { path = "../kb-pc-contracts" }
pm-domain = { path = "../pm-domain" }
sha2.workspace = true
# 依赖倒置：infrastructure 复用 application 定义的 Run 创建 / 调度服务与端口
# （R7 端口在 pm-application，适配器在此）。application 的生产依赖不反向包含
# pm-infrastructure（其对该 crate 仅在 dev-dependencies 中）。
pm-application = { path = "../pm-application" }
sqlx.workspace = true
uuid.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tracing.workspace = true
tokio.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
sqlx.workspace = true
tokio.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
# T-032 §5：Windows Job Object（JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE）——
# 子进程完整回收的平台原语（Codex 派生的 Cargo/Git/Shell 全量终止）。
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
