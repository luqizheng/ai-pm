[package]
name = "pm-mcp"
version.workspace = true
edition.workspace = true

[dependencies]
pm-application = { path = "../pm-application" }
# Workspace pins rmcp features ["server", "transport-io"]; the streamable HTTP
# server transport (mounted under pm-api's /mcp route) needs one extra feature.
# No TLS features are pulled: the streamable HTTP server stack is plain
# http/tower (schannel/native-tls never enters the graph).
rmcp = { workspace = true, features = ["transport-streamable-http-server"] }
# JSON Schema derivation for the tool argument structs; same major as rmcp's
# own schemars (1.x) so the trait implementations unify in one build.
schemars = { version = "1.1", default-features = false, features = ["derive", "std", "uuid1"] }
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
axum.workspace = true
reqwest.workspace = true
