# PA07-IMP-002 §4 P2 定向回归 CI：blast radius 按实际影响条数计。
#
# 演进史：首版（github/master 015e524a）跑 ubuntu-latest，两轮实测失败——
# ① sccache 包装缺失（.cargo/config.toml 默认 rustc-wrapper=sccache，hosted
# runner 未装）→ 以 RUSTC_WRAPPER=env 直通透传修复（6339ef3a）；② 私有
# registry 不可达——Cargo.lock 有 4 个 kellnr crate（digua_*，
# sparse+http://192.168.2.103:16444），GitHub hosted runner 无法访问内网，
# 依赖解析必死于网络错误。②是网络限制不是代码失败，不得据此判红代码，
# 也不得删测试换绿；终态：runs-on 落 self-hosted 标签，作为内部 runner
# 的执行入口（可访问私有 registry 的机器打 `internal-registry` 标签即可）。
#
# RUSTC_WRAPPER=env：环境变量优先于 config 的 sccache；值 `env` 是直通透传
# （`env rustc ...` 等价直接调 rustc），未装 sccache 的机器也能构建。
name: PA-07 Blast Radius Regression

on:
  push:
    branches: [master]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/pm-domain/**"
      - "crates/pm-ai/**"
      - "policies/ai-pm-ai-lead-v2.yaml"
      - ".github/workflows/pa07-blast-radius.yml"
  pull_request:
    branches: [master]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/pm-domain/**"
      - "crates/pm-ai/**"
      - "policies/ai-pm-ai-lead-v2.yaml"
      - ".github/workflows/pa07-blast-radius.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # 直通透传，绕过本仓 .cargo/config.toml 的 sccache 包装（未装机器会构建失败）。
  RUSTC_WRAPPER: env

jobs:
  # 纯函数面：不需要数据库。item_count（pm-domain）与 round_blast_radius /
  # review_proposals（pm-ai self_review）单测锁定阈值语义（10>10 为假、
  # 红线优先、拆分不绕过、批量命令按载荷长度计、饱和累加）。
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - name: pm-domain item_count
        run: cargo test --locked -p pm-domain item_count
      - name: pm-ai self_review
        run: cargo test --locked -p pm-ai --lib self_review

  # 端到端面：orchestrator 集成测试需要 PostgreSQL（sqlx::test 自动建库）。
  # 在仓库 Settings → Variables 配 AIPM_TEST_DATABASE_URL（指向可建临时库的
  # 实例，如 postgres://aipm:aipm@<host>:<port>/aipm）。未配置变量时本 job
  # 主动跳过（结论=SKIP，不是 PASS），避免 CI 假绿。
  integration:
    runs-on: [self-hosted, internal-registry]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - name: pm-ai orchestrator blast-radius regression
        if: ${{ vars.AIPM_TEST_DATABASE_URL != '' }}
        env:
          DATABASE_URL: ${{ vars.AIPM_TEST_DATABASE_URL }}
        run: cargo test --locked -p pm-ai --test orchestrator batch_create_tasks
      - name: Explain skip
        if: ${{ vars.AIPM_TEST_DATABASE_URL == '' }}
        run: echo "::warning::AIPM_TEST_DATABASE_URL 未配置，集成回归跳过（SKIP 非 PASS）"
