name: PA-08 Registry Portability

concurrency:
  group: pa08-registry-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [master]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/config.toml"
      - "crates/**"
      - "apps/**"
      - ".github/workflows/pa08-registry-portability.yml"
  push:
    branches: [master]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/config.toml"
      - "crates/**"
      - "apps/**"
      - ".github/workflows/pa08-registry-portability.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_RUSTC_WRAPPER: ""

jobs:
  windows-mirror-lock:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify Windows OS-backed mirror lock semantics
        run: cargo test -p pm-infrastructure --lib active_mirror_lock_cannot_be_stolen_even_when_lockfile_mtime_is_stale --locked
      - name: Check Runner Windows process cleanup compilation
        run: cargo check -p ai-pm-runner --locked
      - name: Check Worker Windows filesystem metrics compilation
        run: cargo check -p ai-pm-worker --locked

  public-registry-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify locked dependency metadata
        run: cargo metadata --locked --format-version 1 --no-deps
      - name: Verify all Digua crates resolve from crates.io
        shell: bash
        run: |
          for crate in digua_common_jwt digua_common_consul digua_file_sdk digua_http_client; do
            grep -A3 -F "name = \"$crate\"" Cargo.lock | grep -F "registry+https://github.com/rust-lang/crates.io-index"
          done
      - name: Build workspace from public registries
        run: cargo check --workspace --locked
      - name: Run workspace Clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: Run full workspace test suite
        run: cargo test --workspace --locked
      - name: Run Runner integration tests
        run: cargo test -p ai-pm-runner --tests --locked
      - name: Run Runner metrics exporter unit tests
        run: cargo test -p ai-pm-runner --lib metrics::tests --locked
      - name: Run Worker filesystem metrics unit tests
        run: cargo test -p ai-pm-worker --bin ai-pm-worker metrics::tests --locked
      - name: Run Run transition guard PostgreSQL integration tests
        run: cargo test -p pm-application --test run_transition_guard --locked
      - name: Run process cleanup PostgreSQL integration tests
        run: cargo test -p pm-application --test run_cleanup --locked
      - name: Run workspace reclamation ledger PostgreSQL integration tests
        run: cargo test -p pm-application --test workspace_reclamation --locked
      - name: Run Product lifecycle API integration tests
        run: cargo test -p pm-api --test product_domain --locked
      - name: Run Product gate vs Run claim concurrency integration tests
        run: cargo test -p pm-api --test run_claim_lifecycle --locked
      - name: Run application transition guard unit tests
        run: cargo test -p pm-application --lib run_transition_guard --locked
      - name: Run Codex reclamation path safety unit tests
        run: cargo test -p pm-infrastructure codex_executor::imp008_tests --locked
      - name: Run PA08-06 metrics exposition unit tests
        run: cargo test -p pm-api --lib metrics::tests --locked
      - name: Run PA08-06 authenticated metrics HTTP integration tests
        run: cargo test -p pm-api --test auth metrics_endpoint --locked
      - name: Validate PA08-06 Prometheus alert rules
        run: docker run --rm --entrypoint /bin/promtool -v "$PWD/infrastructure/monitoring/pa08-alerts.yml:/etc/prometheus/pa08-alerts.yml:ro" prom/prometheus:v3.5.0 check rules /etc/prometheus/pa08-alerts.yml
      # Check only Rust files changed by this PR/push; unrelated repository formatting debt is tracked separately.
      - name: Check Rust formatting for changed files
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base="${PR_BASE_SHA}"
            head="${PR_HEAD_SHA}"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" && "${PUSH_BEFORE}" != "0000000000000000000000000000000000000000" ]]; then
            base="${PUSH_BEFORE}"
            head="${GITHUB_SHA}"
          else
            base="$(git rev-parse HEAD^)"
            head="HEAD"
          fi
          mapfile -t files < <(git diff --name-only "$base" "$head" -- '*.rs')
          if (("${#files[@]}" == 0)); then
            echo "No changed Rust files."
            exit 0
          fi
          printf 'Checking %s changed Rust files\\n' "${#files[@]}"
          rustfmt --edition 2021 --check "${files[@]}"
