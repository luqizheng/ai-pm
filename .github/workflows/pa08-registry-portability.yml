name: PA-08 Registry Portability

on:
  pull_request:
    branches: [master]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/config.toml"
      - "crates/**"
      - "apps/**"
      - ".github/workflows/pa08-registry-portability.yml"
  push:
    branches: [master]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/config.toml"
      - "crates/**"
      - "apps/**"
      - ".github/workflows/pa08-registry-portability.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_RUSTC_WRAPPER: ""

jobs:
  public-registry-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify locked dependency metadata
        run: cargo metadata --locked --format-version 1 --no-deps
      - name: Verify all Digua crates resolve from crates.io
        shell: bash
        run: |
          for crate in digua_common_jwt digua_common_consul digua_file_sdk digua_http_client; do
            grep -A3 -F "name = \"$crate\"" Cargo.lock | grep -F "registry+https://github.com/rust-lang/crates.io-index"
          done
      - name: Build workspace from public registries
        run: cargo check --workspace --locked
      - name: Run Runner integration tests
        run: cargo test -p ai-pm-runner --tests --locked
      - name: Run Run transition guard PostgreSQL integration tests
        run: cargo test -p pm-application --test run_transition_guard --locked
      - name: Run process cleanup PostgreSQL integration tests
        run: cargo test -p pm-application --test run_cleanup --locked
      - name: Run workspace reclamation ledger PostgreSQL integration tests
        run: cargo test -p pm-application --test workspace_reclamation --locked
      - name: Run application transition guard unit tests
        run: cargo test -p pm-application --lib run_transition_guard --locked
